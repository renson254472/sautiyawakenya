name: Update firm email
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-firm-email.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contact details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          p.write_text(p.read_text().replace('freddyrenson21@gmail.com', 'sautiyawakenya0@gmail.com'))
          Path('README.md').write_text('''# Sautiyawakenya

Responsive PR, social media strategy and communications website.

## Hosting
Use Cloudflare Pages or another business-friendly static host. Connect this repository, choose no framework, no build command, and the repository root as output.

## Contact
The website uses sautiyawakenya0@gmail.com. The enquiry form prepares a mailto draft; it does not submit or store enquiries.

## Photography
See the on-site photography credits and licence links. Images are externally hosted by Wikimedia. For production, optimise and self-host permitted image copies while retaining credits and licences.
''')
          PY
          git rm .github/workflows/update-firm-email.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md
          git diff --cached --quiet || git commit -m 'Update firm contact email'
          git push