name: Update index email
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-index-email.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sed -i "s/freddyrenson21@gmail.com/sautiyawakenya0@gmail.com/g" index.html
      - run: git config user.name github-actions[bot]
      - run: git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - run: git rm .github/workflows/update-index-email.yml
      - run: git add index.html
      - run: git commit -m "Update firm contact email"
      - run: git push
